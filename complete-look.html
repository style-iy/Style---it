<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Style-it | Complete My Look</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">STYLE-IT</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="analysis.html">Style AI</a>
        <a href="#">Profile</a>
    </nav>

</header>


<main class="complete-look-page">

    <section class="analysis-header">

        <p class="tagline">STYLE-IT AI</p>

        <h1>
            Complete your
            <span>look.</span>
        </h1>

        <p>
            Choose one item you already own and Style-it
            will suggest the pieces that complete your outfit.
        </p>

    </section>


    <section class="look-selector">

        <h2>What do you already have?</h2>

        <p>
            Select an item and we'll build an outfit around it.
        </p>


        <div class="look-options">

            <button onclick="chooseLook('Black Bootcut Jeans')">
                👖 Black Bootcut Jeans
            </button>

            <button onclick="chooseLook('Black Oversized T-Shirt')">
                👕 Black Oversized T-Shirt
            </button>

            <button onclick="chooseLook('White Relaxed Fit T-Shirt')">
                👕 White Relaxed Fit T-Shirt
            </button>

            <button onclick="chooseLook('White & Grey Sneakers')">
                👟 White & Grey Sneakers
            </button>

        </div>


        <p id="lookMessage">
            Choose an item above to continue.
        </p>

    </section>


    <section id="outfitResult" class="outfit-result">

    </section>

</main>


<footer>

    <p>© 2026 Style-it</p>

</footer>


<script src="script.js"></script>

</body>
</html>
